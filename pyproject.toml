[project]
name = "gaze-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vure-sh", email = "alimohammed42829@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mediapipe>=1.0.1",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "screeninfo>=0.8.1",
]

[project.scripts]
gaze-tracker = "gaze_tracker:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
